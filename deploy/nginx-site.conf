# The nginx site for Outside: everything for the domain goes to the server on this machine
# (landing page, extension download, API). deploy/root-setup.sh fills in @DOMAIN@ and @PORT@,
# installs it, and has certbot add the certificate lines and the redirect to https.

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # The API only ever takes a small JSON body.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app is told one proxy stands in front (TRUST_PROXY=1): it takes the last address in
        # this header, which is the one nginx itself saw, whatever a visitor wrote before it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;

        # Browsers keep to HTTPS once they have seen this over HTTPS; over plain HTTP they ignore it.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
